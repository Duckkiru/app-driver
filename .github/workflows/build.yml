name: DuckUtil Build & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run DuckUtil Project Compiler
      shell: pwsh
      run: |
        ./Compile.ps1

    - name: Verify Compiled Artifact Up-To-Date
      shell: pwsh
      run: |
        git diff --exit-code DuckUtil.ps1

    - name: Validate Syntax & XAML
      shell: pwsh
      run: |
        Add-Type -AssemblyName PresentationFramework, PresentationCore, WindowsBase
        $code = Get-Content -Raw -Encoding utf8 ./DuckUtil.ps1
        $errors = $null
        $tokens = $null
        $ast = [System.Management.Automation.Language.Parser]::ParseInput($code, [ref]$tokens, [ref]$errors)
        if ($errors) {
            Write-Error "Syntax errors in compiled script!"
            exit 1
        }
        Write-Host "DuckUtil Syntax is 100% Valid!" -ForegroundColor Green
