name: App-Driver Build & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run App-Driver Project Compiler
      shell: pwsh
      run: |
        ./Compile.ps1

    - name: Verify Compiled Artifact Up-To-Date
      shell: pwsh
      run: |
        git diff --ignore-cr-at-eol --exit-code App-Driver.ps1

    - name: Validate Syntax & XAML
      shell: pwsh
      run: |
        Add-Type -AssemblyName PresentationFramework, PresentationCore, WindowsBase
        $bundlePath = (Resolve-Path ./App-Driver.ps1).Path
        $rawBytes = [System.IO.File]::ReadAllBytes($bundlePath)
        $nonAscii = @($rawBytes | Where-Object { $_ -gt 127 }).Count
        if ($nonAscii -gt 0) {
            Write-Error "App-Driver.ps1 contains $nonAscii non-ASCII bytes!"
            exit 1
        }
        $code = Get-Content -Raw -Encoding utf8 $bundlePath
        $errors = $null
        $tokens = $null
        $ast = [System.Management.Automation.Language.Parser]::ParseInput($code, [ref]$tokens, [ref]$errors)
        if ($errors) {
            Write-Error "Syntax errors (ParseInput) in compiled script!"
            exit 1
        }
        $fileErrors = $null
        $fileTokens = $null
        [void][System.Management.Automation.Language.Parser]::ParseFile($bundlePath, [ref]$fileTokens, [ref]$fileErrors)
        if ($fileErrors) {
            Write-Error "Syntax errors (ParseFile) in compiled script!"
            exit 1
        }
        Write-Host "App-Driver Syntax & 7-bit ASCII Validation is 100% Valid!" -ForegroundColor Green
